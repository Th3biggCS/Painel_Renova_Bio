<!DOCTYPE html>
<html lang="pt-BR" class="auto"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Acesso restrito — Renova Bioenergia</title>
<style>
:root{--blue:#0057B8;--blue-d:#003D82;--green:#00A651;--green-d:#00793B;--surface:#fcfcfb;--page:#f2f4f3;--text:#16221c;--muted:#6b6a65;--grid:#e1e0d9;--bad:#b3261e}
*{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px 16px}
.card{width:100%;max-width:400px;background:var(--surface);border-radius:16px;border-top:5px solid var(--green);box-shadow:0 1px 2px rgba(11,11,11,.04),0 8px 28px rgba(11,11,11,.08);padding:28px 26px 24px}
.card img{height:52px;display:block;margin:0 auto 14px}
h1{margin:0;font-size:19px;text-align:center;color:var(--blue-d)}
.sub{margin:6px 0 20px;font-size:13px;text-align:center;color:var(--muted);line-height:1.45}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;letter-spacing:.08em;padding:11px 12px;border:1px solid var(--grid);border-radius:10px;background:#fff;color:var(--text)}
input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--blue-d),var(--blue) 55%,var(--green-d));color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad);text-align:center}
.foot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.auto .card{visibility:hidden}
</style></head><body>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=p=>p.toUpperCase().replace(/[^A-Z0-9]/g,'');
const SK='renova:pw';
function getPw(){try{return sessionStorage.getItem(SK)||localStorage.getItem(SK)}catch(_){return null}}
function savePw(v,rem){try{sessionStorage.setItem(SK,v)}catch(_){}try{if(rem)localStorage.setItem(SK,v);else localStorage.removeItem(SK)}catch(_){}}
function clearPw(){try{sessionStorage.removeItem(SK)}catch(_){}try{localStorage.removeItem(SK)}catch(_){}}
async function open_(pw){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Verificando…';
  const pw=document.getElementById('pw').value;
  try{
    if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
    const html=await open_(pw);
    savePw(norm(pw),document.getElementById('rem').checked);
    show(html);
  }catch(x){
    err.textContent=x.message==='nocrypto'?'Este navegador não permite abrir a página. Use o Chrome, Edge ou Safari atualizado.':'Senha incorreta. Confira e tente de novo.';
    go.disabled=false;go.textContent='Entrar';
  }
});
(async()=>{const s=getPw();
  if(s){try{const html=await open_(s);show(html);return;}catch(_){clearPw();}}
  document.documentElement.classList.remove('auto');
})();
</script></body></html>
